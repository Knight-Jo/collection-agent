[project]
name = "collection-agent-pydantic"
version = "0.1.0"
description = "Pydantic AI agent for OSINT collection (port of pi-prototype-collection)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai",
    "httpx",
    "pyyaml",
    "tldextract",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/intel_agent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".agents", ".opencode", "experiments/runs"]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_documents_extract.py" = ["W291"]
