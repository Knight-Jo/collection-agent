[project]
name = "collection-agent-pydantic"
version = "0.1.0"
description = "Pydantic AI agent for OSINT collection (port of pi-prototype-collection)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-ai>=2,<3",
    "httpx",
    "pyyaml",
    "tldextract",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "uvicorn>=0.30.0",
    "trafilatura>=2.2.0",
    "beautifulsoup4>=4.15.0",
    "pdfplumber>=0.11.10",
    "qdrant-client>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.411",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.16.2",
]
media = [
    "Pillow",
    "openpyxl",
    "python-pptx",
    "faster-whisper",
]
browser = [
    "playwright>=1.48,<2",
]

[project.scripts]
research-agent = "intel_agent.cli:main"
research-dev = "intel_agent.dev:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel_agent"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "configs"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/intel_agent",
    "configs",
    "README.md",
    "pyproject.toml",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that combine real services with local substitutes",
    "real_backend: tests that exercise real external backends",
    "windows: tests that require a Windows host",
]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
extend-exclude = [".agents", ".opencode", "experiments/runs"]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
