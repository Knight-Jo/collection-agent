[project]
name = "collection-agent-pydantic"
version = "0.1.0"
description = "Pydantic AI agent for OSINT collection (port of pi-prototype-collection)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai",
    "httpx",
    "pyyaml",
    "tldextract",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel_agent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
