[project]
name = "collection-agent-pydantic"
version = "0.1.0"
description = "Pydantic AI agent for OSINT collection (port of pi-prototype-collection)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-ai",
    "httpx",
    "pyyaml",
    "tldextract",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.411",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.16.2",
]
media = [
    "Pillow",
    "openpyxl",
    "python-pptx",
    "faster-whisper",
]
browser = [
    "playwright>=1.48,<2",
]

[project.scripts]
intel-agent-web = "intel_agent.web.app:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intel_agent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
extend-exclude = [".agents", ".opencode", "experiments/runs"]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_documents_extract.py" = ["W291"]
