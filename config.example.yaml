model:
  provider: deepseek
  name: deepseek-chat
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY

# 语义审核专用模型（可选；默认与主 agent 相同）
# audit_model:
#   name: deepseek-chat
#   base_url: https://api.deepseek.com/v1
#   api_key_env: DEEPSEEK_API_KEY

search:
  # 本地 SearXNG 实例地址；设为 null 则跳过，只用 Bing/Baidu 直连
  searxng_url: http://127.0.0.1:8888

storage:
  data_dir: data/intel
  raw_dir: data/raw
  output_dir: output

budgets:
  search_attempts: 6
  fetch_attempts_since_evidence: 6
  # 主 agent 最大模型请求数（含工具轮次与独立语义审核请求）
  request_limit: 200

fetch:
  # pinned_fetch 超时/失败时回退到 httpx 抓取（兼容 WAF/Cloudflare 站点，如投资者关系页）
  enable_httpx_fallback: true
  # 静态 HTML 无有效正文时按需使用 Playwright；需安装 browser extra 和 Chromium
  enable_browser_fallback: false
  # validated 仅执行应用层公网 URL 校验；生产环境应配置隔离网络并设为 isolated
  browser_network_mode: validated
  browser_timeout_seconds: 15
  browser_max_requests: 40
  browser_max_bytes: 20971520
  browser_concurrency: 1

crawl:
  max_depth: 2
  max_urls: 200
  max_total_bytes: 1073741824
  max_html_bytes: 5242880
  max_attachment_bytes: 52428800
  concurrency: 4
  per_host_concurrency: 1
  per_host_delay_seconds: 1.0
  cache_ttl_hours: 24
  retries: 2
  obey_robots: true
  ocr_languages: chi_sim+eng
  whisper_model: small
  enabled_by_default: false

web:
  # Web 工作台监听地址和端口；仅本机访问可将 host 设为 127.0.0.1
  host: 0.0.0.0
  port: 6780

sources:
  # 可选的部署级直连来源；留空时由 Agent 针对主题检索。
  financial: []
  ir_company: []
  policy: []
