model:
  name: deepseek-chat
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY

# 本机 llama-server（OpenAI 兼容接口）示例；使用时替换上面的 model 块：
# model:
#   name: Qwen3.5-9B/DeepSeek-V4-Pro-Qwen3.5-9B-MTP-Q4_K_M.gguf
#   base_url: http://127.0.0.1:9876/v1
#   api_key_env: null

# 语义审核专用模型（可选；默认与主 agent 相同）
# audit_model:
#   name: deepseek-chat
#   base_url: https://api.deepseek.com/v1
#   api_key_env: DEEPSEEK_API_KEY

context:
  # 可选档位：16384 / 32768 / 65536 / 131072 / 262144，必须与模型服务实际 n_ctx 一致。
  context_window_tokens: 32768
  # 主 Agent 与语义审核分别限制单次生成，避免本地推理模型长思考耗尽窗口。
  main_output_tokens: 1024
  audit_output_tokens: 512
  # llama-server 的 Qwen thinking 模型建议设为 true；远程接口默认保持 false。
  disable_thinking: false
  # 已连续获得候选但未抓取时，强制从搜索切换到阅读和取证。
  max_search_calls_before_fetch: 3
  # 语义审核并发上限与单次超时；超时返回 SEMANTIC_AUDIT_TIMEOUT，已完成审核不回滚。
  audit_concurrency: 2
  audit_timeout_seconds: 60

search:
  # 本地 SearXNG 实例地址；设为 null 则跳过，只用 Bing/Baidu 直连
  searxng_url: http://127.0.0.1:8888
  # 垂直搜索 Provider：全部匿名、无需任何 API Key（Provider 准入规则）。
  # 每个 Provider 只配置开关与调优，密钥不进入配置。
  github:
    enabled: true
    gitee: true               # GitHub 额度受限时降级到 Gitee（国内可直连）
    # base_url: https://api.github.com
    # timeout: 15
    # rate_limit: 6        # 匿名 Search API 10/min，保守间隔（秒）
    # max_results: 10
    # cache_ttl: 3600      # 结果缓存秒数
    # retry: 0
  academic:
    enabled: true
    arxiv: true
    crossref: true
    semantic_scholar: true   # 仅在前两者去重后结果不足时匿名补充
    supplement_threshold: 3
    # max_results: 10
    # cache_ttl: 3600
  news:
    enabled: true
    baidu: true               # 国内直达级联：百度新闻 → 360新闻 → SearXNG 新闻
    so360: true
    gdelt: false              # 国内网络不可达，默认关闭；有代理环境可开（末位兜底）
    supplement_threshold: 3
    # max_results: 10
    # cache_ttl: 3600
  archive:
    enabled: true
    wayback: true            # 抓取 404/410/DNS 失败时回退 Wayback 快照

storage:
  data_dir: data/intel
  raw_dir: data/raw
  output_dir: output

budgets:
  # 检索广度优先：预算充足时穷尽检索（run 011 起放宽）
  search_attempts: 40
  fetch_attempts_since_evidence: 20
  # 主 agent 最大模型请求数（含工具轮次与独立语义审核请求）
  request_limit: 400

fetch:
  # pinned_fetch 超时/失败时回退到 httpx 抓取（兼容 WAF/Cloudflare 站点，如投资者关系页）
  enable_httpx_fallback: true
  # 静态 HTML 无有效正文时按需使用 Playwright；需安装 browser extra 和 Chromium
  enable_browser_fallback: false
  # validated 仅执行应用层公网 URL 校验；生产环境应配置隔离网络并设为 isolated
  browser_network_mode: validated
  browser_timeout_seconds: 15
  browser_max_requests: 40
  browser_max_bytes: 20971520
  browser_concurrency: 1

crawl:
  max_depth: 3
  max_urls: 200
  # 非一手域每注册域入队上限；null = 自动 max(8, ceil(max_urls * 0.10))。
  # 一手来源（政府/官网/IR）豁免；论坛社区类另有总量 10% 上限（run 013）。
  per_domain_cap: null
  max_total_bytes: 1073741824
  max_html_bytes: 5242880
  max_attachment_bytes: 52428800
  concurrency: 4
  per_host_concurrency: 1
  per_host_delay_seconds: 1.0
  cache_ttl_hours: 24
  retries: 2
  obey_robots: true
  ocr_languages: chi_sim+eng
  whisper_model: small
  enabled_by_default: false

web:
  # Web 工作台监听地址和端口；仅本机访问可将 host 设为 127.0.0.1
  host: 0.0.0.0
  port: 6780

sources:
  # 可选的部署级直连来源；留空时由 Agent 针对主题检索。
  financial: []
  ir_company: []
  policy: []
